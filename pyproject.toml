[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agentic"
version = "0.1.3"
description = "A beautiful, agentic CLI for Ollama — run local LLMs with auto tool-calling, memory, and more"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

keywords = ["ollama", "llm", "cli", "ai", "agent", "local-ai", "terminal"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
]

dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "ollama>=0.4",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[project.scripts]
ollama-cli = "ollama_cli.main:main"

[project.urls]
Homepage   = "https://github.com/Akhil123454321/ollama-cli"
Repository = "https://github.com/Akhil123454321/ollama-cli"
Issues     = "https://github.com/Akhil123454321/ollama-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_cli*"]

[tool.setuptools.package-data]
ollama_cli = ["*.py"]
